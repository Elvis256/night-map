openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: NightMap API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: me
  - name: companions
  - name: connections
  - name: bookings
  - name: reviews
  - name: notifications
  - name: score
  - name: referrals
  - name: safety
  - name: wallet
  - name: streams
  - name: lounges
  - name: city
  - name: verification
  - name: admin

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ───────────────────────── auth ─────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account with phone + PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with phone + PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204":
          description: Logged out

  # ───────────────────────── me ─────────────────────────
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      tags: [me]
      summary: Update profile and preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteMe
      tags: [me]
      summary: Permanently delete the account
      responses:
        "204":
          description: Deleted
  /me/companion-profile:
    patch:
      operationId: updateCompanionProfile
      tags: [me]
      summary: Update companion listing details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanionProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /me/presence:
    post:
      operationId: heartbeat
      tags: [me]
      summary: Presence heartbeat with optional location
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceRequest"
      responses:
        "204":
          description: Recorded
  /me/photos:
    post:
      operationId: uploadPhoto
      tags: [me]
      summary: Upload a profile photo (base64)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadPhotoRequest"
      responses:
        "201":
          description: Photo stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
  /me/photos/{photoId}:
    delete:
      operationId: deletePhoto
      tags: [me]
      summary: Remove a profile photo
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "204":
          description: Removed
  /me/swipes:
    get:
      operationId: getMySwipes
      tags: [me]
      summary: Ids the user has liked or passed
      responses:
        "200":
          description: Swipe ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwipeSummary"
  /me/saved:
    get:
      operationId: getSavedCompanions
      tags: [me]
      summary: Saved companions
      responses:
        "200":
          description: Saved list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanionCard"
  /me/profile-views:
    get:
      operationId: getProfileViews
      tags: [me]
      summary: Who viewed my profile
      responses:
        "200":
          description: Recent viewers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileView"
  /me/stories:
    post:
      operationId: postStory
      tags: [me]
      summary: Post a 24h status story (companions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostStoryRequest"
      responses:
        "201":
          description: Story created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
  /me/score:
    get:
      operationId: getScore
      tags: [score]
      summary: Loyalty points, tier and recent activity
      responses:
        "200":
          description: Score summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreSummary"
  /me/referral:
    get:
      operationId: getReferral
      tags: [referrals]
      summary: Referral code and invite history
      responses:
        "200":
          description: Referral summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralSummary"
  /me/trusted-contacts:
    get:
      operationId: listTrustedContacts
      tags: [safety]
      summary: Trusted contacts
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrustedContact"
    post:
      operationId: addTrustedContact
      tags: [safety]
      summary: Add a trusted contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustedContactRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustedContact"
  /me/trusted-contacts/{contactId}:
    delete:
      operationId: deleteTrustedContact
      tags: [safety]
      summary: Remove a trusted contact
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed

  # ───────────────────────── companions ─────────────────────────
  /companions:
    get:
      operationId: listCompanions
      tags: [companions]
      summary: Browse companions
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: gender
          in: query
          schema:
            type: string
            enum: [female, male]
        - name: status
          in: query
          schema:
            type: string
            enum: [all, now, tonight]
        - name: verifiedOnly
          in: query
          schema:
            type: boolean
        - name: minRating
          in: query
          schema:
            type: number
        - name: maxRate
          in: query
          schema:
            type: integer
        - name: maxDistance
          in: query
          schema:
            type: number
        - name: category
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: excludeSwiped
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Companion cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanionCard"
  /companions/{companionId}:
    get:
      operationId: getCompanion
      tags: [companions]
      summary: Companion detail (records a profile view)
      parameters:
        - $ref: "#/components/parameters/CompanionId"
      responses:
        "200":
          description: Companion detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionDetail"
        "404":
          $ref: "#/components/responses/Error"
  /companions/{companionId}/reviews:
    get:
      operationId: listCompanionReviews
      tags: [reviews]
      summary: Reviews for a companion
      parameters:
        - $ref: "#/components/parameters/CompanionId"
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
  /companions/{companionId}/swipe:
    post:
      operationId: swipeCompanion
      tags: [companions]
      summary: Like or pass a companion
      parameters:
        - $ref: "#/components/parameters/CompanionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwipeRequest"
      responses:
        "200":
          description: Updated swipe summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwipeSummary"
  /companions/{companionId}/save:
    post:
      operationId: toggleSaveCompanion
      tags: [companions]
      summary: Toggle saved state
      parameters:
        - $ref: "#/components/parameters/CompanionId"
      responses:
        "200":
          description: Saved state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedState"
  /deals:
    get:
      operationId: listDeals
      tags: [companions]
      summary: Tonight's deals
      parameters:
        - name: city
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Companions with active deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanionCard"
  /stories:
    get:
      operationId: listStories
      tags: [companions]
      summary: Active companion stories
      parameters:
        - name: city
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Story"

  # ───────────────────────── connections ─────────────────────────
  /connections:
    get:
      operationId: listConnections
      tags: [connections]
      summary: Inbox
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
    post:
      operationId: createConnection
      tags: [connections]
      summary: Send a connection request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionRequest"
      responses:
        "201":
          description: Connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
  /connections/{connectionId}:
    get:
      operationId: getConnection
      tags: [connections]
      summary: One connection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
    patch:
      operationId: respondToConnection
      tags: [connections]
      summary: Accept or decline (companion side)
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondConnectionRequest"
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
  /connections/{connectionId}/messages:
    get:
      operationId: listMessages
      tags: [connections]
      summary: Messages in a connection
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
        - name: after
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [connections]
      summary: Send a message
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /connections/{connectionId}/read:
    post:
      operationId: markConnectionRead
      tags: [connections]
      summary: Mark all messages read
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "204":
          description: Marked

  # ───────────────────────── bookings ─────────────────────────
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: My bookings (either side)
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Request a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /bookings/{bookingId}:
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Accept, decline, cancel, start or complete
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingActionRequest"
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  # ───────────────────────── reviews ─────────────────────────
  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a chemistry score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: Review with points earned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"

  # ───────────────────────── notifications ─────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark notifications read (all when ids omitted)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadRequest"
      responses:
        "204":
          description: Marked
  /notifications/unread-count:
    get:
      operationId: getUnreadCount
      tags: [notifications]
      summary: Unread notification + message counts
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCounts"

  # ───────────────────────── safety ─────────────────────────
  /safety/panic:
    post:
      operationId: triggerPanic
      tags: [safety]
      summary: Send an emergency alert
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyEventRequest"
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyEvent"
  /safety/checkin:
    post:
      operationId: safetyCheckIn
      tags: [safety]
      summary: Share location with trusted contacts
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyEventRequest"
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyEvent"
  /safety/incidents:
    post:
      operationId: reportIncident
      tags: [safety]
      summary: Report an incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentRequest"
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyEvent"
  /safety/events:
    get:
      operationId: listSafetyEvents
      tags: [safety]
      summary: My safety events
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SafetyEvent"

  # ───────────────────────── wallet ─────────────────────────
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Balance, earnings and ledger
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSummary"

  # ───────────────────────── streams ─────────────────────────
  /streams:
    get:
      operationId: listStreams
      tags: [streams]
      summary: Live streams
      responses:
        "200":
          description: Streams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stream"
    post:
      operationId: startStream
      tags: [streams]
      summary: Go live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartStreamRequest"
      responses:
        "201":
          description: Stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
  /streams/{streamId}:
    get:
      operationId: getStream
      tags: [streams]
      summary: Stream detail
      parameters:
        - $ref: "#/components/parameters/StreamId"
      responses:
        "200":
          description: Stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
  /streams/{streamId}/join:
    post:
      operationId: joinStream
      tags: [streams]
      summary: Join as a viewer (also a heartbeat)
      parameters:
        - $ref: "#/components/parameters/StreamId"
      responses:
        "200":
          description: Stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
  /streams/{streamId}/leave:
    post:
      operationId: leaveStream
      tags: [streams]
      summary: Leave the stream
      parameters:
        - $ref: "#/components/parameters/StreamId"
      responses:
        "204":
          description: Left
  /streams/{streamId}/heart:
    post:
      operationId: sendStreamHeart
      tags: [streams]
      summary: Send a heart
      parameters:
        - $ref: "#/components/parameters/StreamId"
      responses:
        "200":
          description: Stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
  /streams/{streamId}/end:
    post:
      operationId: endStream
      tags: [streams]
      summary: End the stream (host)
      parameters:
        - $ref: "#/components/parameters/StreamId"
      responses:
        "200":
          description: Stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
  /streams/{streamId}/comments:
    get:
      operationId: listStreamComments
      tags: [streams]
      summary: Stream comments
      parameters:
        - $ref: "#/components/parameters/StreamId"
        - name: after
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StreamComment"
    post:
      operationId: postStreamComment
      tags: [streams]
      summary: Comment on a stream
      parameters:
        - $ref: "#/components/parameters/StreamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "201":
          description: Comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamComment"

  # ───────────────────────── lounges ─────────────────────────
  /lounges:
    get:
      operationId: listLounges
      tags: [lounges]
      summary: Radio lounges
      responses:
        "200":
          description: Lounges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lounge"
    post:
      operationId: createLounge
      tags: [lounges]
      summary: Start a lounge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoungeRequest"
      responses:
        "201":
          description: Lounge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lounge"
  /lounges/{loungeId}/join:
    post:
      operationId: joinLounge
      tags: [lounges]
      summary: Join a lounge (also a heartbeat)
      parameters:
        - $ref: "#/components/parameters/LoungeId"
      responses:
        "200":
          description: Lounge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lounge"
  /lounges/{loungeId}/leave:
    post:
      operationId: leaveLounge
      tags: [lounges]
      summary: Leave a lounge
      parameters:
        - $ref: "#/components/parameters/LoungeId"
      responses:
        "204":
          description: Left
  /lounges/{loungeId}/end:
    post:
      operationId: endLounge
      tags: [lounges]
      summary: End a lounge (host)
      parameters:
        - $ref: "#/components/parameters/LoungeId"
      responses:
        "200":
          description: Lounge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lounge"

  # ───────────────────────── city ─────────────────────────
  /cities/{city}/weather:
    get:
      operationId: getCityWeather
      tags: [city]
      summary: Current weather for a supported city
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Weather
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Weather"
  /outages:
    get:
      operationId: listOutages
      tags: [city]
      summary: Community-reported power outages
      parameters:
        - name: city
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Outage reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutageReport"
    post:
      operationId: reportOutage
      tags: [city]
      summary: Report a power outage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutageRequest"
      responses:
        "201":
          description: Outage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutageReport"

  # ───────────────────────── verification ─────────────────────────
  /verification:
    get:
      operationId: getVerification
      tags: [verification]
      summary: My latest verification request
      responses:
        "200":
          description: Verification status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"
    post:
      operationId: submitVerification
      tags: [verification]
      summary: Submit ID, selfie and liveness video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitVerificationRequest"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"
  /admin/verifications:
    get:
      operationId: adminListVerifications
      tags: [admin]
      summary: Pending verification requests (admin)
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminVerification"
  /admin/verifications/{requestId}:
    post:
      operationId: adminReviewVerification
      tags: [admin]
      summary: Approve or reject a verification (admin)
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewVerificationRequest"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerification"

